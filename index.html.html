const app=document.getElementById('app');

const sh=a=>[...a].sort(()=>Math.random()-.5),L=s=>s.split(/,\s*/);

function gen(x){
 if(x.t)return{q:x.n,o:mk(x.a,x.w),e:`<b>${x.a}</b>`,tag:x.c};
 const labs=Object.keys(x.f),tag=x.c,e=`<b>${x.n}</b>${fs(x)}`;
 const nums=[];if(x.c=='Коктейлі'&&x.f['Склад'])L(x.f['Склад']).forEach(p=>{const m=p.match(/^(.+?) (\d+)$/);if(m)nums.push(m)});
 if(nums.length&&Math.random()<.4){const m=nums[Math.random()*nums.length|0];return{q:`Скільки мл «${m[1]}» у коктейлі «${x.n}»?`,o:mk(m[2],NP),e,tag}}
 const lb=labs[Math.random()*labs.length|0];
 if(lb=='Склад'||lb=='Смак / ноти'){
  const own=L(x.f[lb]);
  if(own.length>=3&&Math.random()<.7){
   const low=own.map(s=>s.toLowerCase());
   let pool=I.filter(y=>y!==x&&y.c==x.c&&y.f[lb]);if(pool.length<2)pool=I.filter(y=>y!==x&&y.f[lb]);
   const fr=sh(pool.flatMap(y=>L(y.f[lb]))).filter(s=>s.length<60&&!low.some(o=>o.includes(s.toLowerCase())||s.toLowerCase().includes(o)));
   if(fr.length){const w=fr[0];return{q:`Що НЕ входить у «${x.n}»?`,o:sh([...sh(own).slice(0,3).map(t=>({t,ok:false})),{t:w,ok:true}]),e,tag}}
  }}
 let ds=I.filter(y=>y!==x&&y.f[lb]&&y.c==x.c).map(y=>y.f[lb]);
 if(ds.filter(d=>d!=x.f[lb]).length<3)ds=I.filter(y=>y!==x&&y.f[lb]).map(y=>y.f[lb]);
 return{q:`«${x.n}» — ${lb.toLowerCase()}?`,o:mk(x.f[lb],ds),e,tag}}
function menu(){

function ask(){
 const x=R.q[R.i];
 if(S.mode=='f'){app.innerHTML=hd(x.c)+`<div class="card"><div class="q">${x.n}</div><div class="mu">Згадай усе, потім натисни</div></div><div id="nx"><button class="p" onclick="rev()">Показати відповідь</button></div>`;return}
 const g=gen(x);R.g=g;
 app.innerHTML=hd(g.tag)+`<div class="card"><div class="q">${g.q}</div></div>${g.o.map((o,k)=>`<button id="o${k}" onclick="pick(${k})">${o.t}</button>`).join('')}<div id="nx"></div>`}
function pick(k){
 const g=R.g,x=R.q[R.i],ok=g.o[k].ok;
 g.o.forEach((o,j)=>{const e=document.getElementById('o'+j);e.disabled=true;if(o.ok)e.classList.add('ok')});

 document.getElementById('nx').innerHTML=`<div class="card" style="margin-top:12px">${g.e}</div><button class="p" onclick="nxt()">${R.i+1<R.q.length?'Далі':'Результат'}</button>`}
function rev(){const x=R.q[R.i];document.getElementById('nx').innerHTML=`<div class="card">${x.t?`<b>${x.a}</b>`:fs(x)}</div><div class="row"><button onclick="fk(0)">✗ Не знав</button><button onclick="fk(1)">✓ Знав</button></div>`}
function fk(ok){mark(R.q[R.i],ok);nxt()}
function mark(x,ok){if(ok){R.s++;W[key(x)]=Math.max(0,(W[key(x)]||0)-1)}else{R.bad.push(x);W[key(x)]=(W[key(x)]||0)+1}sv()}
function nxt(){R.i++;R.i<R.q.length?ask():end()}
function end(){app.innerHTML=`<div class="card"><div class="q">${R.s} / ${R.q.length}</div></div>${R.bad.length?`<div class="card"><b>Повтори:</b>${R.bad.map(x=>`<p><b>${x.n}</b>${x.t?`<br><span class="mu">${x.a}</span>`:fs(x)}</p>`).join('')}</div>`:'<div class="card">Без помилок! 🎉</div>'}<button class="p" onclick="start()">Ще раз</button><button onclick="menu()">Налаштування</button>`}

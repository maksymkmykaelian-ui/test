  border-radius:3px;

}

button,select{

.q{font:700 21px/1.3 'Old Standard TT','EB Garamond',Georgia,serif;margin-top:4px}

.bar{height:6px;border:1.5px solid var(--bd);border-radius:3px;margin-bottom:12px;background:rgba(0,0,0,.06);overflow:hidden}
